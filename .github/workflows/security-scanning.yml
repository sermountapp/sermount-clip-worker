# Actions are pinned to commit SHAs; the tag each SHA belongs to is noted beside it.
# Dependabot (.github/dependabot.yml) proposes the moves.
name: Security Scanning

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  # Weekly, so a quiet month is not an unscanned month. GitHub runs schedules
  # from the default branch only (main), and emails a failed scheduled run to
  # whoever last changed this cron line.
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 3.11: the python3.11 of the runpod/base image the worker's venv is built on
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.0

      - name: Audit Python dependencies
        # requirements.txt pins the direct packages; pip-audit resolves the rest as pip would.
        run: pip-audit -r requirements.txt --desc

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files '__pycache__/.*' \
            --exclude-files '\.venv/.*' \
            --exclude-files 'out/.*' \
            > /tmp/scan-results.json

      - name: Check results against baseline
        run: python3 .github/scripts/check-secrets-baseline.py
